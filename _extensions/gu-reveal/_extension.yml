title: Gu-reveal
author: tisprang
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      resources:
        - fonts/meridien.ttf
        - fonts/univers.ttf
      embed-resources: true
      theme: [default, custom.scss]
      logo: logo.png
      css: styles.css
      template-partials:
        - title-slide.html
        - toc-slide.html
      width: 100%
      height: 100%
      margin: 0
      slide-number: c/t
      toc: true
      toc-depth: 1
      toc-title: Gliederung
      title-slide-attributes:
        data-state: "hide-menubar"
      section-divs: false
      simplemenu:
        flat: true
        barhtml:
          footer: "<div class='menubar'><ul class='menu'></ul><div>"
      revealjs-plugins:
        - simplemenu
        - slide-contents-wrap