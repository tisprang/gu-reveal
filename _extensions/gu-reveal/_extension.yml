title: Gu-reveal
author: tisprang
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      resources:
        - fonts/meridien.ttf
        - fonts/univers.ttf
      embed-resources: true
      theme: [default, custom.scss]
      logo: logo.png
      css: styles.css
      template: template.html
      template-partials:
        - title-slide.html
        - toc-slide.html
      width: 1920
      height: 1080
      margin: 0
      slide-level: 2
      slide-number: c/t
      show-slide-number: all
      toc: true
      toc-depth: 1
      toc-title: Gliederung
      highlight-style: github
      fig-dpi: 300
      date: today
      date-format: DD.MM.YYYY
      title-slide-attributes:
        data-state: "hide-menubar"
      section-divs: false
      simplemenu:
        flat: true
        barhtml:
          footer: "<div class='menubar'><ol class='menu' type='1'></ol><div>"
      revealjs-plugins:
        - simplemenu
        - slide-contents-wrap
      include-after-body:
        text: >
          <script type="application/javascript" src="append.js"></script>
          <script type="application/javascript" src="author.js"></script>
          <script type="application/javascript" src="context.js"></script>
          <script type="application/javascript" src="title.js"></script>