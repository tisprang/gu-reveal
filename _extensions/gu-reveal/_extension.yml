title: Gu-reveal
author: tisprang
version: 0.2.4
quarto-required: ">=1.4.1"
contributes:
  formats:
    revealjs:
      embed-resources: true
      theme: [default, custom.scss]
      logo: logo.png
      css: 
        - styles.css
      template: template.html
      template-partials:
        - partials/title-slide.html
      width: 1920
      height: 1080
      margin: 0
      slide-level: 2
      slide-number: c/t
      show-slide-number: all
      toc: false
      highlight-style: github
      fig-dpi: 300
      date: today
      date-format: DD.MM.YYYY
      title-slide-attributes:
        data-state: "hide-menubar"
      section-divs: false
      simplemenu:
        flat: true
        barhtml:
          footer: "<div class='menubar'><ol class='menu' type='1'></ol><div>"
        csspath: false
      revealjs-plugins:
        - simplemenu
        - slide-contents-wrap
      include-after-body:
        - file: partials/filters.html